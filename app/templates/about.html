{% extends "base.html" %}

{% block title %}О себе{% endblock %}

{% block content %}
<h1>О себе</h1>
<div class="card">
    <p><span class="label">Имя:</span> {{ profile.name }}</p>
    <p><span class="label">Род занятий:</span> {{ profile.occupation }}</p>
    <p><span class="label">Интересы:</span> {{ profile.interests | join(", ") }}</p>
    <p><span class="label">О себе:</span> {{ profile.bio }}</p>
</div>
{% endblock %}
